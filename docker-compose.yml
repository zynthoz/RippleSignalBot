version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: devkada
      POSTGRES_PASSWORD: devkada_password
      POSTGRES_DB: marketpulse
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
